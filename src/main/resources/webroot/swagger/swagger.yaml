openapi: 3.0.1
info:
  title: testlab
  description: testlab Service
  version: "1.0"
paths:
  /v1/experiments/key-availability:
    get:
      operationId: experimentKeyAvailabilityHandle
      parameters:
      - name: x-project-key
        in: header
        required: true
        schema:
          type: string
      - name: experimentKey
        in: query
        required: true
        schema:
          maxLength: 255
          minLength: 0
          type: string
      responses:
        "200":
          description: Successfully validated experiment key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessExperimentKeyAvailabilityResponse'
        "400":
          description: Invalid project key or experiment key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
  /v1/experiments:
    get:
      operationId: filterExperimentsHandle
      parameters:
      - name: x-project-key
        in: header
        required: true
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: owner
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        "400":
          description: Project Key is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
  /v1/experiments/{experimentId}:
    get:
      operationId: getExperimentHandle
      parameters:
      - name: x-project-key
        in: header
        required: true
        schema:
          type: string
      - name: experimentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        "400":
          description: Experiment Id is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        "404":
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
  /v1/experiments/{experimentId}/history:
    get:
      operationId: getExperimentHistoryHandle
      parameters:
      - name: x-project-key
        in: header
        required: true
        schema:
          type: string
      - name: experimentId
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          description: Successfully fetched experiment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessExperimentHistoryResponse'
        "400":
          description: Invalid project key or experiment id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        "404":
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
  /v1/experiments/tags:
    get:
      operationId: getTagsHandle
      parameters:
      - name: x-project-key
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTagsResponse'
        "400":
          description: Invalid project Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
components:
  schemas:
    ErrorEntity:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        cause:
          type: string
    Failure:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorEntity'
    ExperimentKeyAvailabilityResponse:
      type: object
      properties:
        isAvailable:
          type: boolean
    SuccessExperimentKeyAvailabilityResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ExperimentKeyAvailabilityResponse'
    Success:
      type: object
      properties:
        data:
          type: object
    Experiment:
      type: object
      properties:
        experiment_id:
          type: string
          format: uuid
        project_key:
          type: string
        name:
          type: string
        description:
          type: string
        hypothesis:
          type: string
        experiment_status:
          type: string
          enum:
          - LIVE
          - PAUSED
          - DRAFT
          - CONCLUDED
          - TERMINATED
        experiment_type:
          type: string
          enum:
          - A/A
          - A/B
        guardrail_health_status:
          type: string
          enum:
          - WARNING
          - PASSED
          - NO_CHECKS_AVAILABLE
          - FAILED
        cohorts:
          type: array
          items:
            type: string
        variant_weights:
          $ref: '#/components/schemas/JsonObject'
        assignment_strategy:
          type: string
          enum:
          - RANDOM
          - ROUND_ROBIN
        overrides:
          $ref: '#/components/schemas/JsonObject'
        rule_attributes:
          $ref: '#/components/schemas/JsonObject'
        winning_variant:
          $ref: '#/components/schemas/JsonObject'
        exposure:
          type: integer
          format: int32
        threshold:
          type: integer
          format: int64
        start_time:
          type: integer
          format: int64
        end_time:
          type: integer
          format: int64
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
    FilterExperimentsResponse:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    JsonObject:
      type: object
      properties:
        map:
          type: object
          additionalProperties:
            type: object
        empty:
          type: boolean
    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
    SuccessFilterExperimentsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FilterExperimentsResponse'
    SuccessExperiment:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Experiment'
    ExperimentHistoryEntry:
      type: object
      properties:
        updatedBy:
          type: string
        previousData:
          $ref: '#/components/schemas/JsonObject'
        currentData:
          $ref: '#/components/schemas/JsonObject'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExperimentHistoryResponse:
      type: object
      properties:
        experimentId:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentHistoryEntry'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    SuccessExperimentHistoryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ExperimentHistoryResponse'
    SuccessTagsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TagsResponse'
    TagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
