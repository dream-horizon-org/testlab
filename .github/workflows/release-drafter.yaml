# This workflow broadly does 2 tasks
# 1. Create/Update Release drafts
# 2. Auto Label PRs

# The update-release-draft job handles these tasks, on the basis of event which triggered workflow.
# 1. if push to main by merging PR.
# 2. if pull request opened, reopened, or synchronized (commit push)

name: Draft Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # pull_request event is required only for auto-labeler
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  update-release-draft:
    runs-on: [ self-hosted, linux, X64, k8s, testlab ]

    outputs:
      tag-name: ${{ steps.release-drafter.outputs.tag_name }}

    steps:
      - id: release-drafter
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commitish: main
